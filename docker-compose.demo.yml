name: bmad-manager-demo

# An isolated, disposable Bmad Manager demo. It uses its own database volume
# and ports so it can run alongside the regular development compose stack.
services:
  postgres:
    image: postgres:17.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bmad_demo
      POSTGRES_USER: bmad_demo
      POSTGRES_PASSWORD: bmad_demo_password
    ports:
      - "5434:5432"
    volumes:
      - demo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bmad_demo -d bmad_demo"]
      interval: 5s
      timeout: 2s
      retries: 20

  demo-seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    environment:
      DATABASE_URL: postgresql://bmad_demo:bmad_demo_password@postgres:5432/bmad_demo
      BETTER_AUTH_SECRET: demo-only-secret-change-before-public-use
      BETTER_AUTH_URL: http://localhost:3003
      ALLOW_REGISTRATION: "false"
      ENABLE_LOCAL_FS: "true"
      LOCAL_WORKSPACE_PATH: /demo
      LOCAL_HOST_WORKSPACE: ./demo
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "prisma migrate deploy && pnpm exec tsx scripts/demo-seed.ts"
    volumes:
      - ./demo:/demo:ro
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3003:3000"
    environment:
      DATABASE_URL: postgresql://bmad_demo:bmad_demo_password@postgres:5432/bmad_demo
      BETTER_AUTH_SECRET: demo-only-secret-change-before-public-use
      BETTER_AUTH_URL: http://localhost:3003
      ALLOW_REGISTRATION: "false"
      ENABLE_LOCAL_FS: "true"
      LOCAL_WORKSPACE_PATH: /demo
      LOCAL_HOST_WORKSPACE: ./demo
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    depends_on:
      demo-seed:
        condition: service_completed_successfully
    volumes:
      - ./demo:/demo:ro

volumes:
  demo_postgres_data:
